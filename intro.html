<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Intro</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: #fdf5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        /* Intro Screen Container */
        .intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
            text-align: center;
            padding: 20px;
        }

        /* Top Title Style */
        .intro-title {
            font-family: 'VT323', monospace;
            font-size: 29px;
            letter-spacing: 3px;
            color: #ffe797;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 209, 123, 0.5);
        }

        /* Glowing Birthday Cake Animation Effect (ကြီးမားပြီး လင်းလက်နေသော မွေးနေ့ကိတ်) */
        .cake-container {
            font-size: 150px;
            margin-bottom: 35px;
            animation: cakeGlow 1.5s infinite ease-in-out;
            filter: drop-shadow(0 0 18px rgba(255, 209, 123, 0.7));
        }

        @keyframes cakeGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255, 209, 123, 0.5)); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 28px rgba(255, 209, 123, 0.95)); }
        }

        /* Click Instruction Text */
        .click-text {
            font-family: 'VT323', monospace;
            font-size: 16px;
            letter-spacing: 1px;
            color: #ffe797;
            opacity: 0.8;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body onclick="goToMainPage()">

    <!-- Intro / Landing Screen -->
    <div class="intro-screen" id="introScreen">
        <div class="intro-title">HAPPY 23th BIRTHDAY !</div>
        <div class="cake-container">
            🎂
        </div>
        <div class="click-text">...Click Anywhere to Enter... </div>
    </div>

    <script>
        let isClicked = false;

        function goToMainPage() {
            if (isClicked) return;
            isClicked = true;

            const intro = document.getElementById('introScreen');
            
            // ဖိတ်စင်ပျောက်ကွယ်သွားမည့် Transition အထိုက်
            intro.style.opacity = '0';
            
            setTimeout(() => {
                // နှိပ်လိုက်တာနဲ့ index.html (Main Page) ဆီသို့ အလိုအလျောက် ရောက်သွားပါမည်
                window.location.href = 'index.html';
            }, 800);
        }
    </script>
</body>
</html>
