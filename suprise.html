<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Surprise For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: #fff9f4;
            background-image: 
                radial-gradient(#ffccd5 , transparent 16%),
                radial-gradient(#ffe5ec , transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #fff6ec;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            padding: 30px 20px;
            text-align: center;
            border: 4px solid #fff;
        }

        /* Curved Text Container */
        .curved-header {
            position: relative;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-ribbon {
            font-size: 26px;
            color: #ff8fab;
            margin-bottom: 15px;
        }

        .curved-svg {
            width: 100%;
            height: 55px;
            overflow: visible;
        }

        .curved-text {
            font-family: 'Quicksand', sans-serif;
            font-size: 20px;
            font-weight: 700;
            fill: #5c5252;
            letter-spacing: 1px;
        }

        .header-heart {
            color: #ff6b8b;
            font-size: 24px;
            margin-top: -5px;
            margin-bottom: 20px;
        }

        /* Main Cat Illustration */
        .image-box {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .image-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Greeting Section */
        .greeting {
            font-size: 22px;
            font-weight: 700;
            color: #4a4040;
            margin-bottom: 20px;
            font-family: georgia, 'Times New Roman', Times, serif;
        }

        .subtitle {
            font-size: 14px;
            color: #7a6e6e;
            margin-bottom: 5px;
        }

        .sub-ready {
            font-size: 14px;
            color: #7a6e6e;
            margin-bottom: 25px;
        }

        /* Button Style */
        .surprise-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.4);
            margin-bottom: 20px;
            width: 85%;
        }

        @media (max-width: 400px) {
            .surprise-btn {
                width: 100%;
                padding: 12px 20px;
                font-size: 14px;
            }
        }

        /* Scroll Down Indicator */
        .scroll-down {
            font-size: 12px;
            color: #b0a4a4;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .scroll-down span {
            font-size: 14px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
            60% { transform: translateY(-3px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Curved Text Area -->
        <div class="curved-header">
            <div class="top-ribbon">🎀</div>
            
            <!-- SVG ကိုသုံး၍ စာသားကို ကွေးပေးထားခြင်း -->
            <svg class="curved-svg" viewBox="0 0 300 60">
                <path id="curve" d="M 20,45 Q 150,5 280,45" fill="transparent" />
                <text width="300" text-anchor="middle">
                    <textPath href="#curve" startOffset="50%" text-anchor="middle" class="curved-text">
                        A Little Surprise For You
                    </textPath>
                </text>
            </svg>
            
            <div class="header-heart">♥</div>
        </div>

        <!-- Main Cat Illustration -->
        <div class="image-box">
            <!-- မိမိတို့ရဲ့ ပုံဖိုင်နာမည်ကို ဒီနေရာမှာ ထည့်ပါ -->
            <img src="image/Birthday whish.jpg" alt="Cute Cat Birthday Cake">
        </div>

        <!-- Text Content -->
        <div class="greeting">
            Hey Ah Ko! ♥
        </div>
        <div class="subtitle">I made a little something for you...</div>
        <div class="sub-ready">Are you ready? 👀 ✨</div>

        <!-- Button -->
        <a href="birthday.html" class="surprise-btn">
            🎁 Open Your Surprise ♥
        </a>

        

</body>
</html>
