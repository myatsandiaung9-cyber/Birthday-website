
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Surprise For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: #fff9f4;
            background-image: 
                radial-gradient(#ffccd5 , transparent 16%),
                radial-gradient(#ffe5ec , transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #fff6ec;

            padding: 30px 20px;

            border: 4px solid #fff;
        }

        /* Curved Text Container */
        .curved-header {
            position: relative;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-ribbon {
            font-size: 26px;
            color: #ff8fab;
            margin-bottom: 15px;
        }

        .curved-svg {
            width: 100%;
            height: 55px;
            overflow: visible;
        }

        .curved-text {
            font-family: 'Quicksand', sans-serif;
            font-size: 20px;
            font-weight: 700;
            fill: #5c5252;
            letter-spacing: 1px;
        }

        .header-heart {
            color: #ff6b8b;
            font-size: 24px;
            margin-top: -5px;
            margin-bottom: 20px;
        }

        /* Main Cat Illustration */
        .image-box {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .image-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Greeting Section */
        .greeting {
            font-size: 22px;
            font-weight: 700;
            color: #4a4040;
            margin-bottom: 20px;
            font-family: georgia, 'Times New Roman', Times, serif;
        }

        .subtitle {
            font-size: 14px;
            color: #7a6e6e;
            margin-bottom: 5px;
        }

        .sub-ready {
            font-size: 14px;
            color: #7a6e6e;
            margin-bottom: 25px;
        }

        /* Button Style */
        .surprise-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.4);
            margin-bottom: 20px;
            width: 85%;
        }

        @media (max-width: 400px) {
            .surprise-btn {
                width: 100%;
                padding: 12px 20px;
                font-size: 14px;
            }
        }

        /* Scroll Down Indicator */
        .scroll-down {
            font-size: 12px;
            color: #b0a4a4;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .scroll-down span {
            font-size: 14px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
            60% { transform: translateY(-3px); }
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Happy Birthday Intro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: #fdf5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        /* Intro Screen Container */
        .intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.8s ease;
            text-align: center;
            padding: 20px;
        }

        /* Top Title Style */
        .intro-title {
            font-family: 'VT323', monospace;
            font-size: 29px;
            letter-spacing: 3px;
            color: #ffe797;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 209, 123, 0.5);
        }

        /* Glowing Birthday Cake Animation Effect (ကြီးမားပြီး လင်းလက်နေသော မွေးနေ့ကိတ်) */
        .cake-container {
            font-size: 150px;
            margin-bottom: 35px;
            animation: cakeGlow 1.5s infinite ease-in-out;
            filter: drop-shadow(0 0 18px rgba(255, 209, 123, 0.7));
        }

        @keyframes cakeGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(255, 209, 123, 0.5)); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 28px rgba(255, 209, 123, 0.95)); }
        }

        /* Click Instruction Text */
        .click-text {
            font-family: 'VT323', monospace;
            font-size: 16px;
            letter-spacing: 1px;
            color: #ffe797;
            opacity: 0.8;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
